# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Setup Node.js environment
      uses: actions/setup-node@v6.5.0
      with:
        # File containing the version Spec of the version to use.  Examples: package.json, .nvmrc, .node-version, .tool-versions.
        node-version-file: netlistsvg/package.json
    - name: Install MiKTeX
      run: |
        # 1. Download and dearmor the GPG key
        curl -fsSL https://miktex.org/download/key | sudo gpg --dearmor -o /usr/share/keyrings/miktex.gpg
    
        # 2. Automatically grab the runner's correct Ubuntu codename (e.g., noble or jammy)
        echo "deb [signed-by=/usr/share/keyrings/miktex.gpg] https://miktex.org/download/ubuntu $(lsb_release -cs) universe" | sudo tee /etc/apt/sources.list.d/miktex.list

        # 3. Update apt and install cleanly without prompts
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends miktex
    
        # 4. Finish the basic setup so miktex is ready to use
        miktexsetup finish
        initexmf --set-config-value [MPM]AutoInstall=1
    - name: Install Poppler
      run: |
        sudo apt update
        sudo apt install poppler-utils -y
    - name: Install python dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install -e ".[dev]"
    - name: Lint with ruff
      run: |
        ruff format --check circuit_data_gen/
        ruff check circuit_data_gen/
    - name: Build netlistsvg
      run: |
        cd netlistsvg
        npm install
        npx tsc
        cd ..
    - name: Test with pytest
      run: |
        pytest tests/

