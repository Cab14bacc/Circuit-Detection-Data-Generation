[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "circuit-data-gen"
version = "0.1.0"
description = "Circuit schematic data generation (netlistsvg skins + rendering)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.9",
    "python-dotenv>=1.0",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "python-json-logger>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "build>=1.2",
]

[project.scripts]
cirdg = "circuit_data_gen.cli:app"

[tool.setuptools.packages.find]
include = ["circuit_data_gen*"]

[tool.setuptools.package-data]
circuit_data_gen = [
    "netlist_gen/prompts/*.md",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F"] # Enable default Pyflakes and pycodestyle rules

